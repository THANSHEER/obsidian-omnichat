name: CI

on:
    push:
        branches: ["**"]
    pull_request:
        branches: ["**"]

# Cancel any in-progress run for the same branch when a new push arrives.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    ci:
        name: Automated Obsidian Checks & CI
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: 🔍 Run Obsidian Linter & Security Checks (ESLint)
              run: npm run lint

            - name: 🔍 TypeScript Type-Check
              run: npx tsc --noEmit --skipLibCheck

            - name: 🧪 Run Unit Tests
              run: npm test

            - name: 🔨 Build Release Assets
              run: npm run build

            - name: 🛡️ Validate Manifest & Release Artifacts for Obsidian
              run: node scripts/validate-obsidian.mjs
