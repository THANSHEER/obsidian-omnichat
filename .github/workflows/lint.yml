name: CI

on:
    push:
        branches: ["**"]
    pull_request:
        branches: [main]

# Cancel any in-progress run for the same branch when a new push arrives.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    ci:
        name: ciExpected
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Type-check
              run: npx tsc --noEmit --skipLibCheck

            - name: Unit tests
              run: npm test

            - name: Build
              run: npm run build

            - name: Verify release artifacts
              run: |
                  test -f main.js       || (echo "main.js missing"       && exit 1)
                  test -f manifest.json || (echo "manifest.json missing" && exit 1)
                  test -f styles.css    || (echo "styles.css missing"    && exit 1)
