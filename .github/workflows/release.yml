name: Release

on:
    push:
        branches:
            - main

permissions:
    contents: write
    id-token: write
    attestations: write

jobs:
    release:
        name: Build & publish release
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
              with:
                  # Full history so generate_release_notes can compare against the previous tag.
                  fetch-depth: 0

            - uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: 🔍 Run Obsidian Linter & Security Checks
              run: npm run lint

            - name: 🔍 TypeScript Type-Check
              run: npx tsc --noEmit --skipLibCheck

            - name: 🧪 Run Unit Tests
              run: npm test

            - name: 🔨 Build Release Assets
              run: npm run build

            - name: 🛡️ Validate Manifest & Release Artifacts for Obsidian
              run: node scripts/validate-obsidian.mjs

            - name: Attest artifacts
              uses: actions/attest-build-provenance@v2
              with:
                  subject-path: |
                      main.js
                      manifest.json
                      styles.css

            - name: Get Version
              id: get_version
              run: echo "VERSION=$(node -p "require('./manifest.json').version")" >> $GITHUB_ENV

            - name: Extract release title and notes from CHANGELOG.md
              id: changelog
              run: |
                  SECTION=$(awk -v ver="$VERSION" '
                      $0 ~ "^## \\[" ver "\\]" { found=1; next }
                      found && /^## \[/ { exit }
                      found { print }
                  ' CHANGELOG.md)

                  if [ -z "$(echo "$SECTION" | tr -d '[:space:]')" ]; then
                      echo "No CHANGELOG.md entry for $VERSION — falling back to auto-generated notes."
                      echo "found=false" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi

                  # The section's "### vX.Y.Z - Title" heading becomes the release title;
                  # strip it from the body so it isn't duplicated under the title on GitHub.
                  TITLE=$(echo "$SECTION" | grep -m1 -E "^### v?$VERSION( |$)" | sed -E 's/^### *//')
                  if [ -z "$TITLE" ]; then
                      TITLE="v$VERSION"
                  fi
                  echo "$SECTION" | sed -E "/^### v?$VERSION( |$)/d" > release_notes.md

                  echo "title=$TITLE" >> "$GITHUB_OUTPUT"
                  echo "found=true" >> "$GITHUB_OUTPUT"
              env:
                  VERSION: ${{ env.VERSION }}

            - name: Create GitHub release (from CHANGELOG.md)
              if: steps.changelog.outputs.found == 'true'
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ env.VERSION }}
                  name: ${{ steps.changelog.outputs.title }}
                  token: ${{ secrets.GITHUB_TOKEN }}
                  files: |
                      main.js
                      manifest.json
                      styles.css
                  body_path: release_notes.md
                  make_latest: true

            - name: Create GitHub release (auto-generated notes)
              if: steps.changelog.outputs.found != 'true'
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ env.VERSION }}
                  name: v${{ env.VERSION }}
                  token: ${{ secrets.GITHUB_TOKEN }}
                  files: |
                      main.js
                      manifest.json
                      styles.css
                  generate_release_notes: true
                  make_latest: true
