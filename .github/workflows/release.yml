name: Release

on:
    push:
        branches:
            - main

permissions:
    contents: write
    id-token: write
    attestations: write

jobs:
    release:
        name: Build & publish release
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
              with:
                  # Full history so generate_release_notes can compare against the previous tag.
                  fetch-depth: 0

            - uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Attest artifacts
              uses: actions/attest-build-provenance@v2
              with:
                  subject-path: |
                      main.js
                      manifest.json
                      styles.css

            - name: Get Version
              id: get_version
              run: echo "VERSION=$(node -p "require('./manifest.json').version")" >> $GITHUB_ENV

            - name: Create GitHub release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ env.VERSION }}
                  token: ${{ secrets.GITHUB_TOKEN }}
                  files: |
                      main.js
                      manifest.json
                      styles.css
                  generate_release_notes: true
                  make_latest: true
